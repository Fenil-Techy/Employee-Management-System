<div class="h-screen w-screen bg-[#f8f7ff] flex flex-col md:flex-row overflow-hidden font-sans">

  <!-- Sidebar Navigation -->
  <aside class="w-full md:w-64 lg:w-72 h-auto md:h-full bg-white border-r border-slate-200/80 p-6 flex flex-col justify-between shrink-0 z-10 shadow-sm">

    <div>
      <!-- Brand Logo Header -->
      <div class="flex items-center gap-3 mb-10 px-2 pt-2">
        <div class="w-10 h-10 rounded-xl bg-[#6c5ce7]/10 flex items-center justify-center text-[#6c5ce7] shadow-sm">
          <mat-icon class="!w-6 !h-6 !text-2xl">badge</mat-icon>
        </div>
        <span class="font-extrabold text-xl tracking-tight text-slate-900">EMS Portal</span>
      </div>

      <!-- Navigation Links -->
      <div class="space-y-1.5">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest px-3 mb-3">
          Main Menu
        </p>

        <!-- Dashboard Link -->
        <a
          routerLink="/employee/dashboard"
          routerLinkActive="active-nav-link"
          class="nav-link flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold text-slate-600 hover:text-[#6c5ce7] hover:bg-[#6c5ce7]/5 transition-all duration-200 group"
        >
          <mat-icon class="nav-icon text-slate-400 group-hover:text-[#6c5ce7] transition-colors">grid_view</mat-icon>
          <span>Dashboard</span>
        </a>

        <!-- My Profile Link -->
        <a
          routerLink="/employee/profile"
          routerLinkActive="active-nav-link"
          class="nav-link flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold text-slate-600 hover:text-[#6c5ce7] hover:bg-[#6c5ce7]/5 transition-all duration-200 group"
        >
          <mat-icon class="nav-icon text-slate-400 group-hover:text-[#6c5ce7] transition-colors">person_outline</mat-icon>
          <span>My Profile</span>
        </a>

        <!-- Apply Leave Link -->
        <a
          routerLink="/employee/apply_leave"
          routerLinkActive="active-nav-link"
          class="nav-link flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold text-slate-600 hover:text-[#6c5ce7] hover:bg-[#6c5ce7]/5 transition-all duration-200 group"
        >
          <mat-icon class="nav-icon text-slate-400 group-hover:text-[#6c5ce7] transition-colors">event_note</mat-icon>
          <span>Apply Leave</span>
        </a>

      </div>
    </div>

    <!-- Bottom Sidebar Logout Section -->
    <div class="pt-6 border-t border-slate-100">
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold text-slate-600 hover:text-rose-600 hover:bg-rose-50 transition-all duration-200 group"
      >
        <mat-icon class="nav-icon text-slate-400 group-hover:text-rose-500 transition-colors">logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>

  </aside>

  <!-- Main Content Area - Aligned to TOP -->
  <main class="flex-1 h-full bg-[#f8f7ff] p-6 sm:p-8 lg:p-10 overflow-y-auto flex flex-col justify-start">
    <router-outlet></router-outlet>
  </main>

</div>
